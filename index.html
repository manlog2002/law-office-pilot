<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MASAR Legal OS — نظام تشغيل مكتب المحاماة</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #fff;
      --ink: #172033;
      --muted: #6b7280;
      --line: #e7eaf0;
      --navy: #0d1b2a;
      --blue: #1976d2;
      --red: #c62828;
      --green: #18864b;
      --orange: #b86b00;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Tahoma', 'Arial', sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .app { display: flex; min-height: 100vh; }
    .side {
      width: 255px;
      background: var(--navy);
      color: #fff;
      padding: 18px 14px;
      position: fixed;
      right: 0;
      top: 0;
      bottom: 0;
      overflow: auto;
    }
    .brand {
      padding: 8px 10px 22px;
      border-bottom: 1px solid #ffffff1c;
      margin-bottom: 12px;
    }
    .brand b { font-size: 21px; }
    .brand small { display: block; color: #9fb0c4; margin-top: 5px; }
    .rolebox {
      background: #ffffff10;
      border: 1px solid #ffffff1c;
      border-radius: 12px;
      padding: 10px;
      margin: 10px 0 16px;
    }
    .rolebox select {
      width: 100%;
      margin-top: 7px;
      background: #15263a;
      color: white;
      border: 1px solid #ffffff2b;
      border-radius: 8px;
      padding: 8px;
    }
    .nav button {
      display: flex;
      width: 100%;
      gap: 10px;
      align-items: center;
      background: transparent;
      border: 0;
      color: #c9d4e0;
      padding: 11px 12px;
      border-radius: 9px;
      text-align: right;
      margin: 2px 0;
    }
    .nav button:hover, .nav button.active {
      background: #ffffff12;
      color: #fff;
    }
    .badge {
      margin-right: auto;
      background: #b42318;
      color: #fff;
      border-radius: 20px;
      padding: 2px 7px;
      font-size: 11px;
    }
    .main {
      margin-right: 255px;
      width: calc(100% - 255px);
      padding: 24px 28px;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .top h1 { margin: 0; font-size: 25px; }
    .top p { margin: 5px 0; color: var(--muted); font-size: 13px; }
    .pill {
      padding: 6px 10px;
      border-radius: 999px;
      background: #eef5ff;
      color: #1657a7;
      font-size: 12px;
      font-weight: bold;
      white-space: nowrap;
    }
    .grid { display: grid; gap: 14px; }
    .g4 { grid-template-columns: repeat(4, 1fr); }
    .g3 { grid-template-columns: repeat(3, 1fr); }
    .g2 { grid-template-columns: repeat(2, 1fr); }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 17px;
      box-shadow: 0 2px 8px #0b18320a;
    }
    .metric { font-size: 28px; font-weight: 800; margin-top: 6px; }
    .label { font-size: 12px; color: var(--muted); }
    .section { margin-top: 18px; }
    .section h2 { font-size: 17px; margin: 0 0 11px; }
    .list { display: flex; flex-direction: column; gap: 9px; }
    .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      cursor: pointer;
    }
    .title { font-weight: bold; font-size: 13px; }
    .sub { color: var(--muted); font-size: 11px; margin-top: 4px; }
    .status {
      font-size: 11px;
      padding: 5px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .s-red { background: #fff0f0; color: var(--red); }
    .s-green { background: #ecf8f1; color: var(--green); }
    .s-blue { background: #edf5ff; color: #1657a7; }
    .s-orange { background: #fff5e7; color: var(--orange); }
    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 13px;
    }
    .toolbar input, .toolbar select, .form input, .form select, .form textarea {
      border: 1px solid #d9dee7;
      background: #fff;
      border-radius: 9px;
      padding: 9px 10px;
      outline: none;
    }
    .toolbar input { min-width: 260px; }
    .btn {
      border: 1px solid #d9dee7;
      background: #fff;
      border-radius: 9px;
      padding: 9px 12px;
    }
    .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    .btn.green { background: var(--green); border-color: var(--green); color: #fff; }
    .tablewrap {
      overflow: auto;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    .table { width: 100%; border-collapse: collapse; min-width: 850px; }
    .table th, .table td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--line);
      text-align: right;
      font-size: 12px;
    }
    .table th { background: #fafbfc; color: #5b6574; }
    .table tr:hover td { background: #fbfdff; }
    .link { color: #1264bd; font-weight: bold; cursor: pointer; }
    .split { display: grid; grid-template-columns: 1.2fr .8fr; gap: 14px; }
    .notice {
      padding: 11px;
      border-radius: 10px;
      background: #f5f9ff;
      border: 1px solid #dbeaff;
      font-size: 12px;
    }
    .notice.warn { background: #fff8ec; border-color: #ffe2ad; }
    .kpi { display: flex; align-items: center; justify-content: space-between; }
    .modal {
      position: fixed;
      inset: 0;
      background: #07111f88;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 20;
    }
    .modal.show { display: flex; }
    .modalbox {
      background: #fff;
      width: min(780px, 96vw);
      max-height: 90vh;
      overflow: auto;
      border-radius: 16px;
      padding: 20px;
    }
    .modalhead {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .close {
      border: 0;
      background: #f1f3f6;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      font-size: 18px;
    }
    .timeline {
      border-right: 2px solid #dbe5f0;
      padding-right: 15px;
    }
    .event { margin: 0 0 16px; position: relative; }
    .event:before {
      content: "";
      position: absolute;
      right: -21px;
      top: 4px;
      width: 9px;
      height: 9px;
      background: #1976d2;
      border-radius: 50%;
    }
    .event b { font-size: 12px; }
    .event p { font-size: 11px; color: var(--muted); margin: 4px 0; }
    .formgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .form label {
      font-size: 11px;
      color: #667085;
      display: block;
      margin-bottom: 5px;
    }
    .form input, .form select, .form textarea { width: 100%; }
    .form textarea { min-height: 95px; }
    .footer {
      margin-top: 25px;
      color: #8a93a2;
      font-size: 10px;
      text-align: center;
    }
    @media (max-width: 900px) {
      .side { width: 75px; }
      .side .brand span, .side small, .side .rolebox, .nav button span { display: none; }
      .main { margin-right: 75px; width: calc(100% - 75px); padding: 16px; }
      .g4 { grid-template-columns: repeat(2, 1fr); }
      .g3, .g2, .split, .formgrid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <b>MASAR <span>Legal OS</span></b>
        <small>نظام تشغيل مكتب المحاماة</small>
      </div>
      <div class="rolebox">
        <div style="font-size: 11px; color: #aebdce;">المستخدم الحالي</div>
        <select id="roleSelect" onchange="setRole(this.value)">
          <option value="manager">إدارة المكتب — عثمان (مالك)</option>
          <option value="manager2">إدارة المكتب — علي (مدير)</option>
          <option value="consultant">مستشار قانوني — زينب</option>
          <option value="lawyer">محامية — حنان</option>
        </select>
      </div>
      <div class="nav" id="nav"></div>
    </aside>
    <main class="main">
      <div class="top">
        <div>
          <h1 id="pageTitle"></h1>
          <p id="pageSub"></p>
        </div>
        <span class="pill">DEMO • بيانات اصطناعية</span>
      </div>
      <div id="content"></div>
      <div class="footer">نموذج تجريبي — لا يمثل تكاملًا فعليًا مع ناجز أو WhatsApp API.</div>
    </main>
  </div>
  <div class="modal" id="modal">
    <div class="modalbox">
      <div class="modalhead">
        <h2 id="modalTitle" style="font-size:18px; margin:0"></h2>
        <button class="close" onclick="closeModal()">×</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>
  <script>
    // ==================== البيانات التجريبية ====================
    const cases = [
      ['45192873', 'شركة الأفق للمقاولات', 'عمالية', 'عثمان حسن', 'قيد النظر', '2026-10-15', 'إعداد رد على مذكرة'],
      ['78214019', 'شركة مدار التقنية', 'تجارية', 'زينب أسامة', 'قيد النظر', '2026-10-09', 'مراجعة العقد'],
      ['66390112', 'شركة رواد الإمداد', 'تنفيذ', 'علي إبراهيم', 'تنفيذ', '2026-10-21', 'متابعة الطلب'],
      ['41839027', 'شركة الشرقية للصيانة', 'عمالية', 'زينب أسامة', 'تحتاج تحديث', '2026-10-07', 'التواصل مع العميل'],
      ['90217364', 'شركة نبراس للخدمات', 'عمالية', 'حنان', 'قيد النظر', '2026-10-13', 'متابعة قرار الدائرة'],
      ['73628140', 'شركة روافد التجارية', 'تجارية', 'حنان', 'بانتظار مستند', '2026-10-18', 'استكمال الملف'],
      ['51093427', 'شركة جسور الصناعية', 'عمالية', 'عثمان حسن', 'قيد النظر', '2026-10-22', 'مراجعة محضر الجلسة'],
      ['67120935', 'شركة تمكين للمقاولات', 'تنفيذ', 'علي إبراهيم', 'قيد النظر', '2026-10-28', 'إشعار العميل']
    ].map(x => ({ id: x[0], client: x[1], type: x[2], owner: x[3], status: x[4], hearing: x[5], next: x[6] }));

    const clients = [
      ['C-001', 'شركة الأفق للمقاولات', 'شركة', '+966 55 123 4401', 3, 'العربية'],
      ['C-002', 'شركة مدار التقنية', 'شركة', '+966 54 220 1188', 2, 'العربية'],
      ['C-003', 'شركة رواد الإمداد', 'شركة', '+966 56 904 3310', 1, 'English'],
      ['C-004', 'شركة الشرقية للصيانة', 'شركة', '+966 50 771 2390', 2, 'العربية'],
      ['C-005', 'شركة نبراس للخدمات', 'شركة', '+966 55 884 2001', 1, 'العربية']
    ].map(x => ({ id: x[0], name: x[1], kind: x[2], phone: x[3], cases: x[4], lang: x[5] }));

    const requests = [
      ['REQ-00142', 'شركة الأفق للمقاولات', '45192873', 'استفسار عن حالة القضية', 'عثمان حسن', '14:32', 'بانتظار رد المحامي', 'العربية', 'السلام عليكم، وش صار في القضية ومتى الجلسة القادمة؟'],
      ['REQ-00143', 'شركة مدار التقنية', '78214019', 'طلب مستند', 'زينب أسامة', '16:00', 'معلومات مكتملة', 'العربية', 'نحتاج نسخة من آخر مذكرة ومحضر الجلسة.'],
      ['REQ-00144', 'شركة روافد التجارية', '73628140', 'استفسار عن مستندات', 'حنان', '17:30', 'بانتظار العميل', 'العربية', 'هل تم استلام العقد والمرفقات؟'],
      ['REQ-00145', 'New Client', '—', 'استشارة قانونية', 'مراجعة الإدارة', 'غدًا 10:00', 'طلب جديد', 'English', 'We need a legal consultation regarding an employment dispute.']
    ].map(x => ({ id: x[0], client: x[1], case: x[2], type: x[3], owner: x[4], sla: x[5], status: x[6], lang: x[7], msg: x[8] }));

    const tasks = [
      ['إعداد رد على مذكرة — 45192873', 'عثمان حسن', 'اليوم', 'عاجلة'],
      ['مراجعة عقد — 78214019', 'زينب أسامة', 'غدًا', 'مفتوحة'],
      ['التواصل مع العميل — 41839027', 'زينب أسامة', 'اليوم', 'متأخرة'],
      ['متابعة قرار الدائرة — 90217364', 'حنان', '05 أكتوبر', 'مفتوحة'],
      ['رفع مستندات — 73628140', 'حنان', 'اليوم', 'مفتوحة']
    ].map(x => ({ title: x[0], owner: x[1], due: x[2], status: x[3] }));

    const roles = {
      manager: { name: 'عثمان', label: 'إدارة المكتب', full: true },
      manager2: { name: 'علي', label: 'إدارة المكتب', full: true },
      consultant: { name: 'زينب', label: 'مستشار قانوني', full: false },
      lawyer: { name: 'حنان', label: 'محامية', full: false }
    };

    // ==================== الحالة العامة ====================
    let current = 'manager';
    let view = 'dashboard';

    // ==================== الدوال الأساسية ====================
    function setRole(r) {
      current = r;
      view = 'dashboard';
      render();
    }

    function full() {
      return roles[current].full;
    }

    function allowed() {
      if (full()) return cases;
      if (current === 'consultant') return cases.filter(c => c.owner.includes('زينب'));
      return cases.filter(c => c.owner === 'حنان');
    }

    function navItems() {
      let a = [
        ['dashboard', '▦', 'لوحة التشغيل'],
        ['requests', '◉', 'طلبات العملاء', requests.length],
        ['cases', '▤', 'القضايا'],
        ['clients', '♙', 'العملاء'],
        ['tasks', '✓', 'المهام والمهل'],
        ['hearings', '◷', 'الجلسات']
      ];
      if (full()) a.push(['users', '⚿', 'المستخدمون والصلاحيات'], ['audit', '≡', 'سجل التدقيق']);
      return a;
    }

    function renderNav() {
      document.getElementById('nav').innerHTML = navItems().map(x =>
        `<button class="${view === x[0] ? 'active' : ''}" onclick="go('${x[0]}')">
          <span>${x[1]}</span><span>${x[2]}</span>
          ${x[3] ? `<span class="badge">${x[3]}</span>` : ''}
        </button>`
      ).join('');
    }

    function go(v) {
      view = v;
      render();
    }

    function render() {
      renderNav();
      document.getElementById('roleSelect').value = current;
      const titles = {
        dashboard: 'لوحة إدارة المكتب',
        requests: 'Client Desk — طلبات العملاء',
        cases: 'القضايا',
        clients: 'العملاء',
        tasks: 'المهام والمهل',
        hearings: 'الجلسات',
        users: 'المستخدمون والصلاحيات',
        audit: 'سجل التدقيق'
      };
      document.getElementById('pageTitle').textContent = titles[view];
      document.getElementById('pageSub').textContent =
        `${roles[current].label} • ${roles[current].name} — بيانات تجريبية`;

      const pages = {
        dashboard, requests: requestsPage, cases: casesPage,
        clients: clientsPage, tasks: tasksPage, hearings: hearingsPage,
        users: usersPage, audit: auditPage
      };
      document.getElementById('content').innerHTML = pages[view]();
    }

    // ==================== لوحة التحكم ====================
    function dashboard() {
      let cs = allowed();
      let rs = full() ? requests : requests.filter(r =>
        r.owner.includes(roles[current].name) || r.owner === 'مراجعة الإدارة');
      let ts = full() ? tasks : tasks.filter(t => t.owner.includes(roles[current].name));

      return `
        <div class="grid g4">
          <div class="card"><div class="label">القضايا النشطة</div><div class="metric">${cs.length}</div><div class="label">ضمن نطاق المستخدم</div></div>
          <div class="card"><div class="label">طلبات العملاء</div><div class="metric">${rs.length}</div><div class="label">تحتاج متابعة</div></div>
          <div class="card"><div class="label">مهام اليوم</div><div class="metric">${ts.length}</div><div class="label">مفتوحة / عاجلة</div></div>
          <div class="card"><div class="label">جلسات قادمة</div><div class="metric">${cs.length + 3}</div><div class="label">تقويم تجريبي</div></div>
        </div>
        <div class="section">
          <h2>يحتاج انتباهك اليوم</h2>
          <div class="grid g3">
            <div class="card">
              <div class="kpi"><b>طلبات WhatsApp</b><span class="status s-red">3 تنتظر الرد</span></div>
              <p class="label">الرسائل تتحول إلى Requests قابلة للإسناد والمتابعة.</p>
              <button class="btn primary" onclick="go('requests')">فتح Client Desk</button>
            </div>
            <div class="card">
              <div class="kpi"><b>مهل ومهام</b><span class="status s-orange">2 عاجلة</span></div>
              <p class="label">المواعيد والمهام المرتبطة بالقضايا.</p>
              <button class="btn" onclick="go('tasks')">عرض المهام</button>
            </div>
            <div class="card">
              <div class="kpi"><b>قضايا تحتاج تحديث</b><span class="status s-blue">4</span></div>
              <p class="label">رصد القضايا التي تحتاج Next Action.</p>
              <button class="btn" onclick="go('cases')">فتح القضايا</button>
            </div>
          </div>
        </div>
        <div class="section split">
          <div class="card">
            <h2>آخر طلبات العملاء</h2>
            <div class="list">${rs.slice(0, 4).map(requestRow).join('')}</div>
          </div>
          <div class="card">
            <h2>التشغيل السريع</h2>
            <div class="list">
              <button class="row" onclick="newRequest()"><div><div class="title">＋ إنشاء طلب عميل</div><div class="sub">محاكاة استقبال WhatsApp / اتصال</div></div><b>←</b></button>
              <button class="row" onclick="newCase()"><div><div class="title">＋ فتح قضية جديدة</div><div class="sub">عميل ← تعارض ← إسناد ← قضية</div></div><b>←</b></button>
              <button class="row" onclick="go('audit')"><div><div class="title">سجل التدقيق</div><div class="sub">من فعل ماذا ومتى</div></div><b>←</b></button>
            </div>
          </div>
        </div>
      `;
    }

    function requestRow(r) {
      return `<div class="row" onclick="requestDetail('${r.id}')">
        <div><div class="title">${r.id} — ${r.type}</div>
        <div class="sub">${r.client} • ${r.lang} • ${r.msg}</div></div>
        <span class="status ${r.status.includes('بانتظار') ? 's-orange' : 's-blue'}">${r.status}</span>
      </div>`;
    }

    // ==================== الصفحات ====================
    function requestsPage() {
      let rs = full() ? requests : requests.filter(r =>
        r.owner.includes(roles[current].name) || r.owner === 'مراجعة الإدارة');
      return `
        <div class="toolbar">
          <input id="rqSearch" placeholder="بحث بالعميل أو رقم الطلب..." oninput="filterRequests()">
          <button class="btn primary" onclick="newRequest()">＋ طلب جديد</button>
          <select><option>كل الحالات</option><option>بانتظار الرد</option><option>معلومات مكتملة</option></select>
        </div>
        <div class="tablewrap">
          <table class="table">
            <thead><tr><th>الطلب</th><th>العميل</th><th>التصنيف</th><th>المسؤول</th><th>SLA</th><th>اللغة</th><th>الحالة</th></tr></thead>
            <tbody id="rqBody">${rs.map(r => `
              <tr onclick="requestDetail('${r.id}')">
                <td class="link">${r.id}</td><td>${r.client}</td><td>${r.type}</td>
                <td>${r.owner}</td><td>${r.sla}</td><td>${r.lang}</td>
                <td><span class="status ${r.status.includes('بانتظار') ? 's-orange' : 's-green'}">${r.status}</span></td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>`;
    }

    function filterRequests() {
      let q = document.getElementById('rqSearch').value.toLowerCase();
      document.querySelectorAll('#rqBody tr').forEach(tr =>
        tr.style.display = tr.innerText.toLowerCase().includes(q) ? '' : 'none');
    }

    function casesPage() {
      return `
        <div class="toolbar">
          <input placeholder="بحث بالعميل أو رقم القضية..." oninput="filterTable(this,'.caseRow')">
          <button class="btn primary" onclick="newCase()">＋ قضية جديدة</button>
        </div>
        <div class="tablewrap">
          <table class="table">
